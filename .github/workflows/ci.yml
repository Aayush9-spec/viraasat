# CI workflow for Viraasat
# Runs frontend lint + typecheck + unit tests, and backend pytest suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Jest)
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility scan (axe)
        run: npm run test:a11y -- --project=chromium

      - name: Keyboard smoke test
        run: npm run test:keyboard -- --project=chromium

      - name: Check for leaked secrets
        run: |
          if grep -rnE "(pk_live_|sk_live_)" . \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            --include="*.mjs" --include="*.env*" 2>/dev/null \
            | grep -v node_modules | grep -v ".next" | grep -v ".git" \
            | grep -v "*.example" | grep -v "REPLACE_ME"; then
            echo "⚠️  Live Clerk keys found in source — rotate before deployment"
            exit 1
          fi

  translation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check for untranslated keys
        run: node scripts/check-translations.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cache pip wheels to avoid rebuilding grpcio/protobuf on every run.
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          # Install pre-built wheels where available; grpcio requires native build
          pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate env config
        run: |
          source venv/bin/activate
          python3 -c "
          import os
          issues = []
          if not os.getenv('REQUIRE_AUTH'):
              issues.append('REQUIRE_AUTH not set — defaults to true (safe)')
          if os.getenv('REQUIRE_AUTH') == 'false' and os.getenv('ENVIRONMENT') == 'production':
              issues.append('ERROR: REQUIRE_AUTH=false in production')
          if not os.getenv('ALLOWED_ORIGINS'):
              issues.append('ALLOWED_ORIGINS not set')
          for i in issues:
              print('⚠️ ', i)
          "

      - name: Run test suite (pytest)
        env:
          REQUIRE_AUTH: 'false'
          ALLOWED_ORIGINS: 'http://localhost:9002'
          GOOGLE_CLOUD_VISION_ENABLED: 'false'
          CSAM_HASH_ENABLED: 'false'
          DATABASE_URL: 'memory://'
          ENVIRONMENT: development
        run: |
          source venv/bin/activate
          python3 -m pytest -v

      - name: Backend API smoke test
        env:
          REQUIRE_AUTH: 'false'
          ALLOWED_ORIGINS: 'http://localhost:9002'
          GOOGLE_CLOUD_VISION_ENABLED: 'false'
          CSAM_HASH_ENABLED: 'false'
          DATABASE_URL: 'memory://'
          ENVIRONMENT: development
        run: |
          source venv/bin/activate
          PYTHONPATH=. python3 -c "
          from fastapi.testclient import TestClient
          from main import app
          with TestClient(app) as c:
              r = c.get('/health')
              assert r.status_code == 200, f'health: {r.status_code}'
              r = c.get('/api/forecast-demand?region=Rajasthan&category=Pottery')
              assert r.status_code == 200, f'forecast: {r.status_code}'
              r = c.get('/api/knowledge-graph/search?query=Pottery')
              assert r.status_code == 200, f'kg: {r.status_code}'
              r = c.get('/api/search/semantic?q=silk')
              assert r.status_code == 200, f'search: {r.status_code}'
              print('All backend smoke tests passed ✓')
          "
