# CI workflow for Viraasat
# Runs frontend lint + typecheck, the axe a11y suite, and backend smoke tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (Jest)
        run: npm run test:unit
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Accessibility scan (axe)
        run: npm run test:a11y -- --project=chromium
      - name: Keyboard smoke test
        run: npm run test:keyboard -- --project=chromium
      - name: Check for leaked secrets
        run: |
          if grep -r "pk_test_.*sk_test_" . --include="*.ts" --include="*.tsx" --include="*.js" --include="*.mjs" --include="*.json" 2>/dev/null | grep -v node_modules | grep -v ".next" | grep -v ".git"; then
            echo "⚠️  Potential Clerk test keys found in source - ensure these are replaced before deployment"
          fi
          if grep -r "sk-" . --include="*.ts" --include="*.tsx" --include="*.js" --include="*.mjs" --include="*.json" 2>/dev/null | grep -v node_modules | grep -v ".next" | grep -v ".git" | grep -v "test" | grep -v "__tests__"; then
            echo "⚠️  Potential secret keys found in source - rotate before deployment"
          fi

  translation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check for untranslated keys
        run: node scripts/check-translations.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Validate env config
        run: |
          source venv/bin/activate
          if [ -z "${REQUIRE_AUTH}" ]; then
            echo "⚠️  REQUIRE_AUTH not set - defaults to development behavior"
          fi
          if [ "${REQUIRE_AUTH}" = "true" ] && [ "${ENVIRONMENT}" = "production" ]; then
            echo "✓ REQUIRE_AUTH=true in production mode"
          fi
          if [ -z "${ALLOWED_ORIGINS}" ]; then
            echo "⚠️  ALLOWED_ORIGINS not set"
          fi
      - name: Run test suite (pytest)
        env:
          REQUIRE_AUTH: false
          ALLOWED_ORIGINS: http://localhost:9002
          GOOGLE_CLOUD_VISION_ENABLED: false
          DATABASE_URL: memory://
          ENVIRONMENT: development
        run: |
          source venv/bin/activate
          python3 -m pytest
      - name: Backend API smoke test
        env:
          REQUIRE_AUTH: false
          ALLOWED_ORIGINS: http://localhost:9002
          GOOGLE_CLOUD_VISION_ENABLED: false
          ENVIRONMENT: development
        run: |
          source venv/bin/activate
          PYTHONPATH=. python3 -c "
          from fastapi.testclient import TestClient
          from main import app
          with TestClient(app) as c:
              assert c.get('/health').status_code == 200
              assert c.get('/api/forecast-demand?region=Rajasthan&category=Pottery').status_code == 200
              assert c.get('/api/knowledge-graph/search?query=Pottery').status_code == 200
              print('backend smoke test passed')
          "
